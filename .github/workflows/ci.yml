name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks
        run: bun run ci

      - name: Check Drizzle migrations are up-to-date
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://localhost/ci_check
        run: |
          bunx drizzle-kit generate
          cd ../..
          git diff --exit-code apps/backend/drizzle/ || { echo "ERROR: Schema changes detected without updated migrations. Run 'bun run db:generate' in apps/backend and commit the result."; exit 1; }
